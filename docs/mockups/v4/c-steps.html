<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>C Steps — lab page mockup</title>
<link rel="stylesheet" href="../../../web/css/fonts.css">
<link rel="stylesheet" href="lab.css">
<style>
/* C Steps: one 820px reading column. Know the facts and conditions, then three numbered steps. The numbers carry information. */
.col{max-width:820px;margin:0 auto}
.col > * + *{margin-top:36px}
.facts{grid-template-columns:repeat(4,minmax(0,1fr))}
@container page (max-width:640px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.opts{grid-template-columns:1fr}
@container page (min-width:760px){.opts{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}}
.cond-body{column-width:auto;columns:1}
.step > .sec-h{display:flex;align-items:center;gap:12px}
.step > .sec-h b{display:inline-grid;place-items:center;flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent);color:#fff;font-size:16px}
.equipment > .sec-h{display:none}
.result{display:flex;flex-wrap:wrap;gap:20px 40px;align-items:center;padding:20px;background:var(--surface);border:1px solid var(--line);border-radius:12px}
.result .scorebox{flex:1 1 280px}
@container page (max-width:640px){.scorebar{display:flex}}
</style>
</head>
<body>
<div id="mockbar"></div>
<div class="page">
  <header class="top"><div class="top-in"><span class="wordmark">SICIP Standards</span>
    <nav class="tabs" aria-label="Sections"><a href="#">Competency Standards</a><a href="#" aria-current="page">Lab Standards</a></nav></div></header>
  <main class="main"><div class="col">
    <a class="back" href="#">← Lab Standards</a>
    <header class="head" data-slot="head"></header>
    <div data-slot="facts"></div>
    <div data-slot="space"></div>
    <div data-slot="conditions"></div>
    <section class="step"><h2 class="sec-h"><b>1</b>Enter what the lab has</h2><div data-slot="table"></div></section>
    <section class="step"><h2 class="sec-h"><b>2</b>Check the score</h2><div class="result"><div data-slot="score"></div></div></section>
    <section class="step"><h2 class="sec-h"><b>3</b>Keep a copy</h2><div data-slot="actions"></div></section>
  </div></main>
  <div class="scorebar"><div><small>Score</small><b data-score>0</b> / 100</div><div><small>Points</small><b data-points>0</b> / 30</div><span data-status class="pill"></span></div>
</div>
<script src="lab-data.js"></script>
<script src="lab.js"></script>
</body>
</html>
