<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Directory layout options — SICIP Standards</title>
<link rel="stylesheet" href="../../web/css/fonts.css">
<link rel="stylesheet" href="../../web/css/site.css">
<style>
/* mockup switcher (not part of the site) */
.pick{background:var(--ink);color:#fff;font-size:14px}
.pick-in{max-width:1120px;margin:0 auto;padding:8px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pick a{color:#fff;text-decoration:none;padding:4px 12px;border-radius:20px;border:1px solid rgba(255,255,255,.3)}
.pick a[aria-current]{background:#fff;color:var(--ink);border-color:#fff;font-weight:600}
.pick-note{margin-left:auto;opacity:.75}
.top{top:0}

/* shared row meta */
.c-full b{font-weight:400;color:var(--muted)}

/* A — masonry cards, long lists collapsed */
.masonry{margin-top:20px;columns:3 320px;column-gap:14px}
.masonry .org{break-inside:avoid;margin:0 0 14px}
.more{
  display:block;width:100%;padding:9px 14px;font:inherit;font-size:14.5px;font-weight:500;text-align:left;
  color:var(--accent-ink);background:var(--panel);border:0;border-top:1px solid var(--line);cursor:pointer;
}
.more:hover{background:var(--accent-tint)}

/* B — organisation rail + course pane */
.split{margin-top:20px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:22px;align-items:start}
.rail{
  position:sticky;top:72px;max-height:calc(100vh - 90px);overflow:auto;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;
}
.rail button{
  display:flex;width:100%;gap:10px;align-items:baseline;padding:6px 10px;font:inherit;font-size:15px;text-align:left;
  color:var(--ink);background:none;border:0;border-radius:8px;cursor:pointer;
}
.rail button:hover{background:var(--panel)}
.rail button[aria-current]{background:var(--accent-tint);color:var(--accent-ink);font-weight:600}
.rail button.none{color:var(--faint)}
.rail span{margin-left:auto;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.rail-select{
  display:none;width:100%;padding:11px 12px;font:inherit;font-size:16px;color:var(--ink);
  background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;box-shadow:var(--shadow);
}
.pane{display:grid;gap:14px}
.pane .org-hd{padding:12px 16px}
.rows{list-style:none;margin:0;padding:4px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}
.rows .course a{padding:8px 16px}

/* C — accordion, one line per organisation */
.acc{margin-top:20px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.acc-item + .acc-item{border-top:1px solid var(--line)}
.acc-hd{display:flex;align-items:center;gap:12px;padding:0 14px 0 0}
.acc-hd button{
  flex:1;min-width:0;display:flex;align-items:baseline;gap:14px;padding:12px 16px;font:inherit;text-align:left;
  color:var(--ink);background:none;border:0;cursor:pointer;
}
.acc-hd button:hover{background:var(--panel)}
.acc-hd button::before{content:"›";color:var(--faint);font-size:18px;line-height:1;transition:transform .12s}
.acc-item.open .acc-hd button::before{transform:rotate(90deg)}
.acc-sectors{flex:1;min-width:0;font-size:13.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acc-body{display:none;list-style:none;margin:0;padding:4px 0 10px 18px;grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line);background:var(--panel)}
.acc-item.open .acc-body{display:grid}
.acc-body .course a:hover{background:var(--surface)}

/* credit footer (same in all options) */
.foot{max-width:1120px;margin:0 auto;padding:18px 20px 28px;border-top:1px solid var(--line);font-size:13px;color:var(--muted)}

@media (max-width:760px){
  .split{grid-template-columns:minmax(0,1fr)}
  .rail{display:none}
  .rail-select{display:block}
  .rows,.acc-body{grid-template-columns:minmax(0,1fr)}
  .acc-sectors{display:none}
  .pick-note{display:none}
}
</style>
</head>
<body>
<div class="pick">
  <div class="pick-in">
    <span>Mockup</span>
    <a href="#a" data-option="a">A · Packed cards</a>
    <a href="#b" data-option="b">B · Organisation rail</a>
    <a href="#c" data-option="c">C · Accordion</a>
    <span class="pick-note">real data · search works · course links are inert</span>
  </div>
</div>
<header class="top">
  <div class="top-in">
    <a class="wordmark" href="#">SICIP&nbsp;Standards</a>
    <nav class="tabs" aria-label="Sections">
      <a href="#" aria-current="page">Competency Standards</a>
      <a href="#">Lab Standards</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <div class="dir-head">
    <h1>Competency Standards</h1>
    <p class="dir-sub" id="sub"></p>
    <div class="search"><input id="q" type="search" autocomplete="off"
      placeholder="Search course, sector or organisation…" aria-label="Search"></div>
  </div>
  <div id="out"></div>
</main>
<footer class="foot">Built by Riad Mashrub Shourov</footer>

"PKSF", "Housekeeping", "Tourism & Hospitality", "22 Apr 2025"], ["REHAB", "Electrical Installation & Maintenance (Construction)", "Construction", "31 Jul 2025"], ["REHAB", "Plumbing and Pipe Fitting", "Construction", "31 Jul 2025"], ["REHAB", "Masonry and Steel Binding", "Construction", null], ["REHAB", "Tile and Marble Works", "Construction", "31 Jul 2025"], ["WEAB", "Food and Beverage Production and Entrepreneurship Development", "Tourism and Hospitality", "11 Sep 2025"], ["WEAB", "Bakery & Pastry Production and Entrepreneurship Development", "Tourism and Hospitality", "11 Sep 2025"], ["WEAB", "Digital Marketing, IT Freelancing and Entrepreneurship Development", "ICT", "11 Sep 2025"], ["WEAB", "Fashion Design, Product Development and Entrepreneurship", "RMG", "29 Apr 2026"], ["WEAB", "Beautification and entrepreneurship development", null, "11 Sep 2025"], ["WEAB", "Graphic Design ad Entrepreneurship Development", "ICT", "11 Sep 2025"], ["WEAB", "Professional Barista & Beverage Preparation and Entrepreneurship Development", "Tourism and Hospitality", "08 Dec 2025"]];

const COLLAPSED_LIMIT = 10;  // option A: courses shown before "Show all"
const MINIMUM_HIDDEN = 3;    // option A: never collapse to hide only one or two rows
const organisations = [];
for (const [organisation, course, sector, approved] of DATA) {
  let entry = organisations.find(item => item.name === organisation);
  if (!entry) { entry = { name: organisation, courses: [] }; organisations.push(entry); }
  entry.courses.push({ course, sector, approved });
}

const state = { option: 'a', query: '', selected: '', expanded: new Set(), open: new Set() };
const out = document.getElementById('out');
const esc = text => String(text).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

// organisation match shows the whole organisation; otherwise only matching courses
function visibleCourses(organisation) {
  if (!state.query || organisation.name.toLowerCase().includes(state.query)) return organisation.courses;
  return organisation.courses.filter(item => (item.course + ' ' + (item.sector || '')).toLowerCase().includes(state.query));
}

function courseItem(item) {
  const meta = [item.sector, item.approved && 'Approved ' + item.approved].filter(Boolean).join(' · ');
  return `<li class="course"><a href="#" data-inert>
    <span class="c-name">${esc(item.course)}</span><span class="c-full">${esc(meta)}</span></a></li>`;
}

function badge(count) {
  return `<a class="org-count" href="#" data-inert title="Download all">${count} ↓</a>`;
}

function renderPackedCards(shown) {
  return `<div class="masonry">${shown.map(({ organisation, courses }) => {
    const collapsed = !state.query && !state.expanded.has(organisation.name) && courses.length >= COLLAPSED_LIMIT + MINIMUM_HIDDEN;
    const listed = collapsed ? courses.slice(0, COLLAPSED_LIMIT) : courses;
    return `<section class="org">
      <div class="org-hd"><span class="org-name">${esc(organisation.name)}</span>${badge(organisation.courses.length)}</div>
      <ul class="course-list">${listed.map(courseItem).join('')}</ul>
      ${collapsed ? `<button class="more" data-expand="${esc(organisation.name)}">Show all ${courses.length}</button>` : ''}
    </section>`;
  }).join('')}</div>`;
}

function renderRail(shown) {
  const matched = new Map(shown.map(({ organisation, courses }) => [organisation.name, courses.length]));
  const total = shown.reduce((sum, item) => sum + item.courses.length, 0);
  const railButton = (name, label, count) =>
    `<button data-select="${esc(name)}" class="${count ? '' : 'none'}" ${state.selected === name ? 'aria-current="true"' : ''}>${esc(label)}<span>${count}</span></button>`;
  const inPane = shown.filter(({ organisation }) => !state.selected || organisation.name === state.selected);
  // phones get the same choices as a native picker instead of the rail
  const option = (name, label, count) =>
    `<option value="${esc(name)}" ${state.selected === name ? 'selected' : ''} ${count ? '' : 'disabled'}>${esc(label)} (${count})</option>`;
  return `<div class="split">
    <select class="rail-select" aria-label="Organisation">
      ${option('', 'All organisations', total)}
      ${organisations.map(item => option(item.name, item.name, matched.get(item.name) || 0)).join('')}
    </select>
    <nav class="rail" aria-label="Organisations">
      ${railButton('', 'All organisations', total)}
      ${organisations.map(item => railButton(item.name, item.name, matched.get(item.name) || 0)).join('')}
    </nav>
    <div class="pane">${inPane.map(({ organisation, courses }) => `
      <section class="org">
        <div class="org-hd"><span class="org-name">${esc(organisation.name)}</span>${badge(organisation.courses.length)}</div>
        <ul class="rows">${courses.map(courseItem).join('')}</ul>
      </section>`).join('') || '<p class="empty show">No matches in this organisation.</p>'}
    </div>
  </div>`;
}

function renderAccordion(shown) {
  return `<div class="acc">${shown.map(({ organisation, courses }) => {
    const sectors = [...new Set(organisation.courses.map(item => item.sector).filter(Boolean))].join(' · ');
    const isOpen = state.query || state.open.has(organisation.name);
    return `<section class="acc-item ${isOpen ? 'open' : ''}">
      <div class="acc-hd">
        <button data-toggle="${esc(organisation.name)}" aria-expanded="${Boolean(isOpen)}">
          <span class="org-name">${esc(organisation.name)}</span><span class="acc-sectors">${esc(sectors)}</span>
        </button>${badge(organisation.courses.length)}
      </div>
      <ul class="acc-body">${courses.map(courseItem).join('')}</ul>
    </section>`;
  }).join('')}</div>`;
}

function render() {
  const shown = organisations
    .map(organisation => ({ organisation, courses: visibleCourses(organisation) }))
    .filter(item => item.courses.length);
  document.getElementById('sub').textContent = `${organisations.length} organisations · ${DATA.length} standards`;
  document.querySelectorAll('.pick a').forEach(link => link.toggleAttribute('aria-current', link.dataset.option === state.option));
  if (!shown.length) { out.innerHTML = '<p class="empty show">No matches.</p>'; return; }
  const renderers = { a: renderPackedCards, b: renderRail, c: renderAccordion };
  out.innerHTML = renderers[state.option](shown);
}

function toggle(set, value) {
  if (set.has(value)) set.delete(value); else set.add(value);
}

out.addEventListener('click', event => {
  const target = event.target.closest('[data-inert],[data-expand],[data-select],[data-toggle]');
  if (!target) return;
  event.preventDefault();
  if ('expand' in target.dataset) state.expanded.add(target.dataset.expand);
  if ('select' in target.dataset) state.selected = target.dataset.select;
  if ('toggle' in target.dataset) toggle(state.open, target.dataset.toggle);
  render();
});
out.addEventListener('change', event => {
  if (!event.target.matches('.rail-select')) return;
  state.selected = event.target.value;
  render();
});
document.getElementById('q').addEventListener('input', event => {
  state.query = event.target.value.trim().toLowerCase();
  render();
});
function readOption() {
  const fromHash = location.hash.slice(1);
  if (['a', 'b', 'c'].includes(fromHash)) state.option = fromHash;
  render();
}
addEventListener('hashchange', readOption);
readOption();
</script>
</body>
</html>
